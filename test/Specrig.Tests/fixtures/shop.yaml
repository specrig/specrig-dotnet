openapi: 3.1.0
info:
  title: shop
  version: "1"
paths:
  /items/{id}:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/new:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [draft]
                properties:
                  draft:
                    type: boolean
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                count:
                  type: integer
      responses:
        "204":
          description: created
components:
  schemas:
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
