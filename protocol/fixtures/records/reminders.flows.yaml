        cases:
          - "reminders.feature: A payment report the reminders cannot read is dropped"
outputs:
  - message: event reminders.sent
    fields:
      - amount
      - order
  - message: http GET /invoices
  - message: http POST /reminders
    fields:
      - amount
      - order
