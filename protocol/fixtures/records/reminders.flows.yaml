specrig: flows/1
service: reminders
inputs:
  - message: command SendReminders
    branches:
      - sends:
          - http GET /invoices
          - http POST /reminders
          - event reminders.sent
        sent:
          event reminders.sent:
            - amount
            - order
          http POST /reminders:
            - amount
            - order
        cases:
          - "reminders.feature: A customer whose invoice is overdue is reminded"
          - "reminders.feature: Every overdue customer is reminded"
  - message: event invoices.paid
    fields:
      - order
    branches:
      - cases:
          - "reminders.feature: A payment billing reports is acknowledged"
