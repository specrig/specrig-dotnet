name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: the tag is the packages' version
        run: test "v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props)" = "$GITHUB_REF_NAME"
      - run: make test
      - name: pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o dist -p:ContinuousIntegrationBuild=true
          done
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
